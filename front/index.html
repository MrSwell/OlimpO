<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestión del gimnasio Olimpo" />
    <title>Olimpo — Gestión del gimnasio</title>
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var storedTheme = window.localStorage.getItem('olimpo-theme')
          if (storedTheme) {
            var parsedTheme = JSON.parse(storedTheme)
            if (parsedTheme && parsedTheme.state && parsedTheme.state.mode === 'light') {
              theme = 'light'
            }
          }
        } catch (error) {
          theme = 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
