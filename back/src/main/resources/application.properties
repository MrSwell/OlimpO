spring.application.name=olimpo

# ===== .env support (not committed; see .env.example) =====
spring.config.import=optional:file:.env[.properties]

# ===== MySQL Datasource (override via environment variables in production) =====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/olimpo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:narutoramen12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# Schema is managed by Flyway migrations, not by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway (migrations already applied manually, baseline at V5) =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ===== JWT (override via environment variables in production) =====
jwt.secret=${JWT_SECRET:olimpo-dev-jwt-secret-key-change-me-in-production-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
